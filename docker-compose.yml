services:

  # ─── PostgreSQL Database ───────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: savings_planner_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: quant
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - savings_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Express Backend ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: savings_planner_backend
    environment:
      PORT: 5001
      NODE_ENV: development
      DB_USERNAME: postgres
      DB_PASSWORD: yourpassword
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: quant
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      JWT_EXPIRES_IN: 24h
      FRONTEND_URL: http://localhost:8080
      ADMIN_PROMOTE_EMAIL: Securetester2@gmail.com
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - savings_network
    restart: unless-stopped
    develop:
      watch:
        # App code → copy into container; nodemon restarts the API
        - path: ./backend/src
          action: sync
          target: /app/src
          initial_sync: true
        # Dependency changes need a full image rebuild
        - path: ./backend/package.json
          action: rebuild
        - path: ./backend/package-lock.json
          action: rebuild
        - path: ./backend/Dockerfile.dev
          action: rebuild

  # ─── React Frontend ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: savings_planner_frontend
    environment:
      REACT_APP_API_URL: http://localhost:5001/api
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WDS_SOCKET_PORT: "0"
    ports:
      - "8080:3000"
    depends_on:
      - backend
    networks:
      - savings_network
    restart: unless-stopped
    develop:
      watch:
        # Source / public → sync; CRA hot-reloads in the browser
        - path: ./frontend/src
          action: sync
          target: /app/src
          initial_sync: true
        - path: ./frontend/public
          action: sync
          target: /app/public
          initial_sync: true
        # Tailwind / PostCSS config → sync then restart CRA
        - path: ./frontend/tailwind.config.js
          action: sync+restart
          target: /app/tailwind.config.js
        - path: ./frontend/postcss.config.js
          action: sync+restart
          target: /app/postcss.config.js
        # Dependency / Dockerfile changes need a rebuild
        - path: ./frontend/package.json
          action: rebuild
        - path: ./frontend/package-lock.json
          action: rebuild
        - path: ./frontend/Dockerfile.dev
          action: rebuild

# ─── Volumes ──────────────────────────────────────────────────
volumes:
  postgres_data:
    # This persists database data even when containers restart

# ─── Networks ─────────────────────────────────────────────────
networks:
  savings_network:
    driver: bridge
